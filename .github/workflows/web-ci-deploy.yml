name: Web CI + Deploy

on:
  push:
    branches:
      - main
      - ajithkumarkasi-work
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci-deploy.yml'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck web
        run: npm run -w apps/web typecheck

      - name: Build web
        run: npm run -w apps/web build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.WEB_DEPLOY_HOOK_URL != '' }}

    steps:
      - name: Trigger frontend deploy hook
        run: curl -fsSL -X POST "$WEB_DEPLOY_HOOK_URL"
        env:
          WEB_DEPLOY_HOOK_URL: ${{ secrets.WEB_DEPLOY_HOOK_URL }}
