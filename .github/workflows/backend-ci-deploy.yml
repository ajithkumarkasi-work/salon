name: Backend CI + Deploy

on:
  push:
    branches:
      - main
      - ajithkumarkasi-work
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-ci-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck API
        run: npm run -w apps/api typecheck

      - name: Build API
        run: npm run -w apps/api build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.API_DEPLOY_HOOK_URL != '' }}

    steps:
      - name: Trigger backend deploy hook
        run: curl -fsSL -X POST "$API_DEPLOY_HOOK_URL"
        env:
          API_DEPLOY_HOOK_URL: ${{ secrets.API_DEPLOY_HOOK_URL }}
