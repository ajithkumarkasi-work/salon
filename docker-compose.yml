services:
  postgres:
    image: postgres:16
    container_name: glowbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: glowbook
    ports:
      - "5432:5432"
    volumes:
      - glowbook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glowbook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  glowbook_pgdata:
